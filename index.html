<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garage — maquette 3D et guide de montage</title>
<style>
  /* Thème clair à fort contraste : la notice se lit en extérieur, en plein
     soleil, où un thème sombre devient illisible (R9). */
  :root {
    --fond: #ffffff;
    --texte: #10171c;
    --texte-faible: #47535c;
    --bord: #b7c1c8;
    --accent: #0b5cab;
    --alerte: #a3231b;
    --avertissement: #8a5a00;
    --cible: 64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--texte);
    background: var(--fond);
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100dvh;
    overflow: hidden;
    font-size: 17px;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 8px 12px; border-bottom: 2px solid var(--bord);
  }
  header h1 { font-size: 1.05rem; margin: 0 12px 0 0; }
  header button {
    min-height: 44px; padding: 0 14px; font-size: 0.95rem;
    border: 2px solid var(--bord); border-radius: 8px; background: #fff;
    color: var(--texte); cursor: pointer;
  }
  header button:hover { border-color: var(--accent); }
  #vues { display: flex; gap: 6px; flex-wrap: wrap; }

  main { position: relative; min-height: 0; }
  #scene { position: absolute; inset: 0; }
  #scene canvas { width: 100%; height: 100%; }

  #fiche {
    position: absolute; top: 10px; right: 10px; width: min(340px, calc(100% - 20px));
    background: #fff; border: 2px solid var(--bord); border-radius: 10px;
    padding: 12px 14px; max-height: calc(100% - 20px); overflow: auto;
    box-shadow: 0 6px 20px rgba(0,0,0,.18);
  }
  #fiche h2 { margin: 0 0 8px; font-size: 1.15rem; }
  #fiche h3 { margin: 14px 0 6px; font-size: .9rem; text-transform: uppercase; color: var(--texte-faible); }
  .ligne { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px solid #eef1f3; }
  .libelle { color: var(--texte-faible); }
  .valeur { font-weight: 600; text-align: right; }
  /* Une valeur non déterminée se voit comme telle, jamais comblée (FR-007). */
  .valeur.inconnu { color: var(--avertissement); font-style: italic; font-weight: 500; }
  .avertissement { font-size: .85rem; color: var(--texte-faible); margin: 10px 0 0; }
  #fiche .fermer { margin-top: 10px; min-height: 44px; width: 100%; border: 2px solid var(--bord);
    border-radius: 8px; background: #fff; font-size: 1rem; cursor: pointer; }

  #bandeau, #incertains {
    position: absolute; left: 10px; right: 10px; top: 10px; z-index: 5;
    border-radius: 10px; padding: 10px 14px; font-size: .95rem;
  }
  #incertains { top: auto; bottom: 10px; background: #fff6e5; border: 2px solid var(--avertissement); color: #4a3200; }
  .bandeau.bloquant { background: #fdecea; border: 2px solid var(--alerte); color: #5a120d; }
  .bandeau.avertissement { background: #fff6e5; border: 2px solid var(--avertissement); color: #4a3200; }
  #bandeau ul { margin: 6px 0 0; padding-left: 20px; }

  footer { border-top: 2px solid var(--bord); display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 10px 12px; }
  @media (max-width: 720px) { footer { grid-template-columns: 1fr; } }

  #etape .entete { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
  #etape .rang { font-weight: 700; font-size: 1.05rem; }
  #etape .phase, #etape .nature {
    font-size: .8rem; text-transform: uppercase; letter-spacing: .03em;
    border: 1px solid var(--bord); border-radius: 999px; padding: 2px 10px; color: var(--texte-faible);
  }
  #etape .tension {
    font-size: .8rem; font-weight: 700; letter-spacing: .05em;
    background: var(--alerte); color: #fff; border-radius: 999px; padding: 3px 12px;
  }
  #etape .instruction { font-size: 1.15rem; line-height: 1.45; margin: 6px 0; }
  #etape .bloc { margin-top: 6px; }
  #etape h3 { font-size: .8rem; text-transform: uppercase; color: var(--texte-faible); margin: 6px 0 2px; }
  #etape ul { margin: 0; padding-left: 20px; }
  #etape, footer > div { max-height: 34dvh; overflow: auto; }

  #controles { display: flex; gap: 10px; align-items: center; }
  /* Cibles largement au-delà des minima : elles sont actionnées avec des gants. */
  #controles .nav {
    min-height: var(--cible); min-width: 150px; font-size: 1.1rem; font-weight: 600;
    border: 3px solid var(--accent); border-radius: 12px; background: #fff; color: var(--accent);
    cursor: pointer; touch-action: manipulation;
  }
  #controles .nav:disabled { border-color: var(--bord); color: #97a3ab; cursor: default; }
  #controles .saut { display: flex; flex-direction: column; font-size: .8rem; color: var(--texte-faible); }
  #controles input { min-height: 44px; width: 90px; font-size: 1.1rem; text-align: center;
    border: 2px solid var(--bord); border-radius: 8px; }
</style>
</head>
<body>
  <header>
    <h1>Garage — maquette et guide de montage</h1>
    <div id="vues"></div>
    <button type="button" id="ouvrants">Ouvrants</button>
  </header>

  <main>
    <div id="scene"></div>
    <div id="bandeau" class="bandeau" hidden></div>
    <div id="incertains" hidden></div>
    <aside id="fiche" hidden></aside>
  </main>

  <footer>
    <div id="etape"></div>
    <div id="controles"></div>
  </footer>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
